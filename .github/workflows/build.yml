name: build

on:
  push:
    branches:
      - master
      - main
      - 'feat/**'
      # Maintenance branches (CI tweaks, dependency bumps, docs) build too — they
      # are still code that will be merged, so they deserve the same gate.
      - 'chore/**'
    # Doc-only pushes (README, notes, licence) do not need a 13-20 min assemblePure
    # run: no source, resource or build file changes are involved. A push is
    # skipped only when *every* changed path matches; mixing docs with code still
    # triggers CI. Add `[skip ci]` to the commit message for one-off skips.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - master
      - main
    # Same rule for PRs: a docs-only PR stays mergeable without burning a run.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: assemblePure + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # NDK >= r23 reads this and, when ccache is on PATH, routes the C/C++
    # toolchain through it. llama.cpp (a submodule, thousands of translation
    # units x arm64-v8a + x86_64) is by far the longest pole, so a warm ccache
    # turns a full native compile into a near-noop.
    env:
      ANDROID_USE_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-android v3 defaults to `sdkmanager tools`, a package that no longer
      # exists in the SDK repository (exit 1). Pin the list explicitly.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      # NOTE: do *not* cache $ANDROID_HOME/ndk. The runner image already ships
      # the NDKs, AGP never downloads one on this project, and the archive is
      # ~2 GB — saving it alone cost ~7 minutes while restoring it merely
      # overwrote files that were already on disk.
      - name: Install ccache
        run: |
          # ubuntu-latest does not ship ccache, so ANDROID_USE_CCACHE alone did
          # nothing. Install it before CMake configures the native toolchain.
          sudo apt-get install -y -qq ccache > /dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq ccache
          }
          ccache --version | head -1

      - name: Cache ccache (native build)
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ hashFiles('llama-cpp/native/llama.cpp/**', 'llama-cpp/src/main/cpp/**', 'workspace/src/main/cpp/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # web/build.gradle.kts:installWebUiDeps downloads the web-ui dependency
      # tree with bun; the vite buildWebUi task depends on it.
      - name: Cache web-ui node_modules
        uses: actions/cache@v4
        with:
          path: web-ui/node_modules
          key: webui-${{ runner.os }}-${{ hashFiles('web-ui/bun.lock', 'web-ui/pnpm-lock.yaml') }}
          restore-keys: |
            webui-${{ runner.os }}-

      - name: Android SDK inventory
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | timeout 180 sdkmanager --licenses > /dev/null 2>&1 || true
          for d in platforms build-tools ndk cmake; do
            echo "--- $d"
            ls "$ANDROID_HOME/$d" 2>/dev/null || echo "(none)"
          done

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show toolchain versions
        run: |
          java -version
          bun --version
          pnpm --version
          echo "--- ccache ---"
          which ccache && ccache --version && ccache -s || echo "ccache NOT installed"

      # web-ui/bun.lock is not committed upstream (only pnpm-lock.yaml is), while
      # web/build.gradle.kts:installWebUiDeps runs `bun install --frozen-lockfile`.
      # Bootstrap it the same way a local checkout does: bun migrates the pins.
      - name: Bootstrap web-ui lockfile
        working-directory: web-ui
        run: |
          if [ -f bun.lock ]; then
            echo "bun.lock present"
          else
            echo "bun.lock missing -> generating from pnpm-lock.yaml pins"
            bun install
          fi

      # Single Gradle invocation: one daemon, one configuration phase. Build only
      # the shipping variant ("pure": R8 + optimized resource shrinking, keep rules
      # in src/main/keepRules) and run the JVM unit tests against that same variant.
      # The old debug build is gone on purpose: it compiled every library subproject
      # a second time and rebuilt the llama.cpp native libs a second time, for an
      # artifact nothing shipped. The published APK is `app-*-pure-unsigned.apk`,
      # re-signed on the VPS with p2.keystore (dl2.sh apk-pure).
      #
      # Library modules' JVM unit tests are listed explicitly (testDebugUnitTest
      # for every module that has src/test): :app:testPureUnitTest does not run
      # them. :ai was the first one wired in (provider request-shape tests); the
      # rest followed with the com.clma package rename so every moved test runs
      # at least once in CI. They are plain JVM tests, seconds not minutes.
      - name: Assemble pure APK + unit tests
        env:
          # Fast lane: a push to a feature branch (feat/**) skips the release
          # lint pass. Pushes to main/master and pull requests keep lintVital as
          # the release gate — see skipLintVital in app/build.gradle.kts.
          SKIP_LINT: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
        run: |
          FLAGS=""
          if [ "$SKIP_LINT" = "true" ]; then
            echo "fast lane: -PskipLintVital"
            FLAGS="-PskipLintVital"
          fi
          LIB_TESTS=":ai:testDebugUnitTest :common:testDebugUnitTest :document:testDebugUnitTest \
            :highlight:testDebugUnitTest :llama-cpp:testDebugUnitTest :local-llm:testDebugUnitTest \
            :material3:testDebugUnitTest :oauth:testDebugUnitTest :search:testDebugUnitTest \
            :speech:testDebugUnitTest :web:testDebugUnitTest :workspace:testDebugUnitTest"
          # --continue: one failing module must not hide the results of the others.
          ./gradlew :app:assemblePure :app:testPureUnitTest $LIB_TESTS --continue $FLAGS --stacktrace

      - name: Show pure APK sizes
        run: ls -la app/build/outputs/apk/pure/*.apk || true

      - name: Show ccache stats
        if: always()
        run: ccache -s -v || true

      - name: Upload pure APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-pure
          path: app/build/outputs/apk/pure/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            */build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
