name: tmp-apply-capsule-patch

# Temporary helper: applies tmp/capsule_big3.patch to this branch, commits the
# result and removes both the patch and this workflow in the same commit, so the
# PR diff ends up containing only the real change.
on:
  push:
    paths:
      - '.github/workflows/tmp-apply-capsule-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/capsule-style-whole-card
          fetch-depth: 0

      - name: Apply patch, commit, self-delete
        run: |
          set -euo pipefail
          git config user.name 'C2CWL'
          git config user.email 'LuChen.687@proton.me'
          git apply -v tmp/capsule_big3.patch
          git rm -q .github/workflows/tmp-apply-capsule-patch.yml tmp/capsule_big3.patch
          git add -A
          git commit -m 'fix(tools): 胶囊样式覆盖整张思考卡，不再要求纯工具组'
          git push origin HEAD:fix/capsule-style-whole-card
