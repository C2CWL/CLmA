name: tmp-apply-capsule-patch

# Temporary: applies tmp/capsule_big3.patch on this branch, then deletes itself and the
# patch file in the same commit. Kept out of the PR diff because the files are gone by
# the time the branch is opened for review.
on:
  push:
    branches:
      - fix/capsule-style-whole-card

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/capsule-style-whole-card
          fetch-depth: 0

      - name: Apply the patch and drop the temporary files
        run: |
          set -euo pipefail
          git config user.name "clma-bot"
          git config user.email "clma-bot@users.noreply.github.com"
          git apply -v tmp/capsule_big3.patch
          git rm -q tmp/capsule_big3.patch .github/workflows/tmp-apply-capsule-patch.yml
          git add -A
          git commit -m "fix(tools): 胶囊样式覆盖整张思考卡，不再要求纯工具组"
          git push origin HEAD:fix/capsule-style-whole-card
